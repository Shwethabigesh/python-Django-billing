<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>CUSTOMERLIST</h2>
    <table border="1" cellpadding="8">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>phone</th>
            <th>email</th>
        </tr>
        {% for c in customers %}
        <tr>
            <td>{{c.id}}</td>
            <td>{{c.name}}</td>
            <td>{{c.phone}}</td>
            <td>{{c.email}}</td>

        </tr>
        {%endfor%}

    </table>
    <br>
    <a href="{% url 'home'%}">Back to Home</a>
</body>
</html>
