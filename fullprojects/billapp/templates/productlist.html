<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>PRODUCT LIST</h2>
    <table border="1" cellpadding="8">
        <tr>
            <th>customer</th>
            <th>productName</th>
            <th>price</th>
            <th>stock</th>
        </tr>
        {% for p in products %}
        <tr>
            <td>{{p.customer}}</td>
            <td>{{p.name}}</td>
            <td>{{p.price}}</td>
            <td>{{p.stock}}</td>

        </tr>
        {%endfor%}

    </table>
    <br>
    <a href="{% url 'home'%}">Back to Home</a>
</body>
</html>
